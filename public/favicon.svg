<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Deep obsidian background gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1a1a2e" />
      <stop offset="60%" stop-color="#090910" />
      <stop offset="100%" stop-color="#030306" />
    </radialGradient>

    <!-- Primary neon gradient (Cyan -> Apple Blue -> Electric Violet) -->
    <linearGradient id="neonV" x1="18" y1="20" x2="102" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64d2ff" />
      <stop offset="48%" stop-color="#2997ff" />
      <stop offset="100%" stop-color="#bf5af2" />
    </linearGradient>

    <!-- Secondary accent gradient for X / 4 crossbar -->
    <linearGradient id="neonPulse" x1="100" y1="22" x2="24" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff375f" />
      <stop offset="50%" stop-color="#bf5af2" />
      <stop offset="100%" stop-color="#2997ff" />
    </linearGradient>

    <!-- Rim border metallic gradient -->
    <linearGradient id="rimLight" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)" />
      <stop offset="50%" stop-color="rgba(41,151,255,0.25)" />
      <stop offset="100%" stop-color="rgba(191,90,242,0.45)" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Hardware Frame -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#bgGlow)" stroke="url(#rimLight)" stroke-width="2.5" />

  <!-- Subtle inner acoustic radar ring -->
  <circle cx="60" cy="60" r="42" stroke="url(#neonV)" stroke-opacity="0.16" stroke-width="1.5" stroke-dasharray="4 6" />

  <!-- Audio Waveform Bars integrated into the core -->
  <g opacity="0.35">
    <rect x="24" y="52" width="3" height="16" rx="1.5" fill="#64d2ff" />
    <rect x="31" y="44" width="3" height="32" rx="1.5" fill="#2997ff" />
    <rect x="86" y="44" width="3" height="32" rx="1.5" fill="#bf5af2" />
    <rect x="93" y="52" width="3" height="16" rx="1.5" fill="#ff375f" />
  </g>

  <!-- Stylized Geometric "V" + "4" + "X" Monogram -->
  <g filter="url(#softGlow)">
    <!-- Main V Wing -->
    <path
      d="M28 32 L55 88 C57 92 63 92 65 88 L92 32"
      stroke="url(#neonV)"
      stroke-width="9.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Futuristic "4" / "X" Cyber Crossbar -->
    <path
      d="M78 32 L42 66 H84"
      stroke="url(#neonPulse)"
      stroke-width="6.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Glowing Neural Node at Apex -->
  <circle cx="60" cy="88" r="4.5" fill="#ffffff" />
</svg>
